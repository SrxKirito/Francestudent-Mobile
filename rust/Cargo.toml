[workspace]
members = ["crates/francestudent", "crates/chat-ui", "apps/desktop", "apps/mobile"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "ISC"
authors = ["Hecone"]

[workspace.dependencies]
dioxus = { version = "0.7", default-features = false, features = ["minimal"] }
francestudent = { path = "crates/francestudent" }
chat-ui = { path = "crates/chat-ui" }

[profile.dev]
debug = 0
