name: Construire le mobile Rust pour iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - 'rust-iphone-*'
    paths:
      - 'rust/**'
      - '.github/workflows/build-rust-iphone.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Installer la CLI Dioxus
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$arch" = arm64 ]; then arch=aarch64; fi
          asset="dx-${arch}-apple-darwin"
          base="https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10"
          curl --fail --location --retry 3 --output "/tmp/$asset.tar.gz" "$base/$asset.tar.gz"
          curl --fail --location --retry 3 --output "/tmp/$asset.sha256" "$base/$asset.sha256"
          expected="$(awk -v filename="$asset.tar.gz" '$2 == filename || $2 == "*" filename { print $1 }' "/tmp/$asset.sha256")"
          actual="$(shasum -a 256 "/tmp/$asset.tar.gz" | awk '{print $1}')"
          test "$expected" = "$actual"
          mkdir -p "$RUNNER_TEMP/dioxus-bin"
          tar -xzf "/tmp/$asset.tar.gz" -C "$RUNNER_TEMP/dioxus-bin"
          echo "$RUNNER_TEMP/dioxus-bin" >> "$GITHUB_PATH"
      - name: Compiler l’application iPhone
        working-directory: rust/apps/mobile
        run: dx bundle --ios --release --target aarch64-apple-ios --package-types ios --out-dir ../../../iphone-build
      - name: Préparer l’IPA à signer
        shell: bash
        run: |
          set -euo pipefail
          app="$(find iphone-build -type d -name '*.app' -prune -print -quit)"
          test -n "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          lipo "$app/$executable" -verify_arch arm64
          mkdir -p iphone-artifact/Payload
          ditto "$app" "iphone-artifact/Payload/$(basename "$app")"
          ditto -c -k --sequesterRsrc --keepParent iphone-artifact/Payload iphone-artifact/FranceStudent-Rust-iPhone.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FranceStudent-Rust-iPhone
          path: iphone-artifact/FranceStudent-Rust-iPhone.ipa
          if-no-files-found: error
